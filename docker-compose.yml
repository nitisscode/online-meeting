services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_meeting}
      POSTGRES_USER: ${POSTGRES_USER:-online_meeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-online_meeting}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-online_meeting}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 1 — Django core backend (REST, auth, persistence)
  django-backend:
    build: ./services/django-backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --reload"
    volumes:
      - ./services/django-backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phase 2 — Go real-time signaling (WebSockets, WebRTC)
  go-signaling:
    profiles: ["phase2"]
    build: ./services/go-signaling
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/1
      DJANGO_API_URL: http://django-backend:8000
    depends_on:
      redis:
        condition: service_healthy
      django-backend:
        condition: service_started

  # Phase 3 — Python AI service (Whisper, LLM, summaries)
  ai-service:
    profiles: ["phase3"]
    build: ./services/ai-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/2
      DJANGO_API_URL: http://django-backend:8000
    depends_on:
      redis:
        condition: service_healthy
      django-backend:
        condition: service_started

  # Phase 4 — API gateway
  nginx:
    profiles: ["phase4"]
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django-backend

volumes:
  postgres_data:
  redis_data:
